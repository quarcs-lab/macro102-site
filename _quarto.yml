project:
  type: book
  # The lecture decks (/write-slides) are rendered on their own and copied as-is.
  resources:
    - slides/
    # Redirects from the appendix addresses before the 2026-10-19 relettering (growth D-F, DSGE G-H)
    - notebooks/appD-dsge-modeling-with-python.html
    - notebooks/appE-the-dsge-model-of-smets-and-wouters.html
    - notebooks/appF-growth-and-development-accounting.html
    - notebooks/appG-growth-and-convergence-across-countries.html
    - notebooks/appH-augmented-solow-growth-model.html
  output-dir: _site
  # Only these are rendered: src/ holds the notebook sources and data/ the CSVs.
  render:
    - index.qmd
    - notebooks/*.ipynb

book:
  title: "Data Science and Macroeconomic Models"
  subtitle: "A Python Companion to Intermediate Macroeconomics"
  author: "Carlos Mendez"
  cover-image: images/book-cover-python-macroeconomics.png
  repo-url: https://github.com/quarcs-lab/macro102-site
  repo-actions: [source, issue]
  # A top bar whose right end holds the search, the GitHub link and the light/dark toggle
  navbar:
    search: true
  page-footer:
    center: "© 2026 Carlos Mendez. Licensed under [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)."
  chapters:
    - index.qmd
    # BEGIN notebooks (managed by /write-notebook; do not edit by hand)
    - notebooks/ch01-introduction-to-macroeconomics.ipynb
    - notebooks/ch02-measuring-the-macroeconomy.ipynb
    - notebooks/ch03-an-overview-of-long-run-economic-growth.ipynb
    - notebooks/ch04-a-model-of-production.ipynb
    - notebooks/ch05-the-solow-growth-model.ipynb
    - notebooks/ch06-growth-and-ideas.ipynb
    - notebooks/ch07-the-labor-market-wages-and-unemployment.ipynb
    - notebooks/ch08-inflation.ipynb
    - notebooks/ch09-an-introduction-to-the-short-run.ipynb
    - notebooks/ch10-the-great-recession-and-the-covid-19-pandemic-a-first-look.ipynb
    - notebooks/ch11-the-is-curve.ipynb
    - notebooks/ch12-monetary-policy-and-the-phillips-curve.ipynb
    - notebooks/ch13-stabilization-policy-and-the-as-ad-framework.ipynb
    - notebooks/ch14-financial-crises-and-the-short-run-model.ipynb
    - notebooks/ch15-dsge-models-the-frontier-of-business-cycle-research.ipynb
    - notebooks/ch16-consumption.ipynb
    - notebooks/ch17-investment.ipynb
    - notebooks/ch18-the-government-and-the-macroeconomy.ipynb
    - notebooks/ch19-international-trade.ipynb
    - notebooks/ch20-exchange-rates-and-international-finance.ipynb
    - notebooks/ch21-parting-thoughts.ipynb
    # END notebooks
    # Appendices are listed by hand (a part, so Quarto adds no second "Appendix A" to their titles)
    - part: "Appendices"
      chapters:
        - notebooks/appA-google-colab-python-and-data-science-libraries.ipynb
        - notebooks/appB-accessing-macroeconomic-data-with-python.ipynb
        - notebooks/appC-math-review-for-macroeconomics.ipynb
        - notebooks/appD-growth-and-development-accounting.ipynb
        - notebooks/appE-growth-and-convergence-across-countries.ipynb
        - notebooks/appF-augmented-solow-growth-model.ipynb
        - notebooks/appG-dsge-modeling-with-python.ipynb
        - notebooks/appH-the-dsge-model-of-smets-and-wouters.ipynb

# Notebooks are executed locally (with saved outputs) by /write-notebook; Quarto never runs them.
execute:
  enabled: false

format:
  html:
    # Dark is listed first, so it is the default; the toggle in the top bar switches to light
    # and Quarto remembers the reader's choice. Colors: _includes/theme-dark.scss (book cover)
    # and _includes/theme-light.scss (chapter PDFs); the charts follow via plotly-theme.html.
    theme:
      dark: [cosmo, _includes/theme-dark.scss]
      light: [cosmo, _includes/theme-light.scss]
    highlight-style:
      dark: _includes/highlight-dark.theme
      light: arrow
    css: _includes/styles.css
    # plotly.js must load before the require.js that Quarto adds for HTML outputs,
    # otherwise the saved Plotly figures stay blank on the website. plotly-theme.html
    # must come right after it, before the saved charts are drawn.
    include-in-header:
      - _includes/plotly-head.html
      - _includes/plotly-theme.html
    toc: true
    number-sections: false
    grid:
      sidebar-width: 260px
      body-width: 920px
      margin-width: 240px
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
