<!-- live-plot.html — draws the deck's live Plotly figures (COPIED VERBATIM by write-slides).
     Each figure slide holds   <script src="plots/figK.js"></script>
                               <div class="live-plot" data-fig="figK"></div>
     plots/figK.js (written by scripts/extract_live_figures.py) sets window.DECK_PLOTS["figK"] to
     the book's own Plotly figure (data, layout, config, frames), re-themed for the dark canvas.
     A plot is drawn the first time its slide is shown (lazy: decks hold many large figures) and
     resized whenever it is shown again. In ?print-pdf mode every plot is drawn at once.
     plotly.js is the same version as the book site (_includes/plotly-head.html). Hover works
     under reveal's CSS scaling (checked with plotly.js 2.35.2 at scales 0.7-1.125). -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"
        integrity="sha384-cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7"
        crossorigin="anonymous"></script>
<script>
(function () {
  function draw(el) {
    if (el.dataset.drawn) { Plotly.Plots.resize(el); return; }
    var f = (window.DECK_PLOTS || {})[el.dataset.fig];
    if (!f) { el.textContent = "Missing plot " + el.dataset.fig + " (plots/" + el.dataset.fig + ".js)"; return; }
    el.dataset.drawn = "1";
    var layout = JSON.parse(JSON.stringify(f.layout));
    Plotly.newPlot(el, f.data, layout, f.config).then(function () {
      if (f.frames) Plotly.addFrames(el, f.frames);
    });
  }
  function drawIn(slide) { if (slide) slide.querySelectorAll(".live-plot").forEach(draw); }
  function start() {
    if (/print-pdf/.test(location.search)) document.querySelectorAll(".live-plot").forEach(draw);
    else drawIn(Reveal.getCurrentSlide());
  }
  if (Reveal.isReady()) start(); else Reveal.on("ready", start);
  Reveal.on("slidechanged", function (e) { drawIn(e.currentSlide); });
  Reveal.on("resize", function () { drawIn(Reveal.getCurrentSlide()); });
  Reveal.on("overviewhidden", function () { drawIn(Reveal.getCurrentSlide()); });
})();
</script>
