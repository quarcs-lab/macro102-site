<!-- Google Translate widget at the top of every page (as in the author's metricsai book).
     Code, math and chart outputs are marked translate="no", so a translation never changes them. -->
<div id="google_translate_element" class="book-translate"></div>
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
  }, 'google_translate_element');
}
(function () {
  function keep() {
    document.querySelectorAll('pre, code, .math, mjx-container, .cell-output, .cell-output-display, .js-plotly-plot')
      .forEach(function (e) { e.setAttribute('translate', 'no'); e.classList.add('notranslate'); });
  }
  document.addEventListener('DOMContentLoaded', keep);
  window.addEventListener('load', keep);
})();
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
