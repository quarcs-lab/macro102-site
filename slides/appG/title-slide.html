$if(visual-summary)$
<!-- Title slide = the chapter visual summary (the mind-map image), full-bleed, nothing else.
     The image is painted as the slide background (data-background-image) so it spans the full
     width and fills the entire slide; `size=contain` always shows the WHOLE image, never cropped.
     The 16:9 mind maps match the 1280×720 canvas exactly; on a non-16:9 screen the bars take
     `visual-summary-bg` (the image's own edge colour, written by sync_mindmap_images.py),
     falling back to DeepSlate #0f172a. No title/subtitle/byline text is rendered. -->
<section id="$idprefix$title-slide" class="quarto-title-block title-visual-summary" data-background-image="$visual-summary$" data-background-size="contain" data-background-color="$if(visual-summary-bg)$$visual-summary-bg$$else$#0f172a$endif$"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
</section>
$else$
<section id="$idprefix$title-slide" class="quarto-title-block"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
$if(deck-author)$
  <p class="author">$if(deck-author-url)$<a href="$deck-author-url$">$deck-author$</a>$else$$deck-author$$endif$</p>
$endif$
$for(institute)$
  <p class="institute">$institute$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$
</section>
$endif$
