<!-- Book layout (as in the author's metricsai book): the cover above the table of contents, an
     "On this page" panel on phones, and buttons that hide or show the two sidebars on desktops.
     Styles: _includes/styles.css ("Book layout"). -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  // Path from this page to the site root: book pages load site_libs/ relative to it; the Data Apps
  // pages (rendered on their own in apps/) and any other page one folder down use "../".
  function siteRoot() {
    var s = document.querySelector('script[src*="site_libs/"], link[href*="site_libs/"]');
    if (s) {
      var u = s.getAttribute('src') || s.getAttribute('href');
      return u.slice(0, u.indexOf('site_libs/'));
    }
    return /\/(apps|notebooks)\/[^\/]*$/.test(window.location.pathname) ? '../' : '';
  }
  function store(key, value) {
    try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); }
    catch (e) { return null; }
  }

  var toc = document.getElementById('TOC');

  /* ── The cover above the table of contents (links to the Preface) ── */
  if (toc) {
    var root = siteRoot();
    var cover = document.createElement('a');
    cover.id = 'toc-cover-image';
    cover.href = root + 'index.html';
    cover.title = 'Preface';
    var img = document.createElement('img');
    img.src = root + 'images/book-cover-ai-powered-python.webp';
    img.alt = 'Cover of Data Science and Macroeconomic Models';
    img.onerror = function () { cover.remove(); };   // a site without the cover file shows no card
    cover.appendChild(img);
    toc.parentNode.insertBefore(cover, toc);
  }

  /* ── Phones: an "On this page" button in Quarto's secondary bar opens a slide-in panel ── */
  var tocList = toc && toc.querySelector('ul');
  if (tocList && tocList.children.length) {
    var overlay = document.createElement('div');
    overlay.className = 'mobile-toc-overlay';
    var panel = document.createElement('div');
    panel.className = 'mobile-toc-panel';
    var header = document.createElement('div');
    header.className = 'mobile-toc-header';
    var title = document.createElement('p');
    title.className = 'mobile-toc-title';
    title.textContent = 'On this page';
    var closeBtn = document.createElement('button');
    closeBtn.className = 'mobile-toc-close';
    closeBtn.setAttribute('aria-label', 'Close');
    closeBtn.innerHTML = '×';
    header.appendChild(title);
    header.appendChild(closeBtn);
    var content = document.createElement('div');
    content.className = 'mobile-toc-content';
    // Filled each time the panel opens, like the desktop table of contents: every section, and the
    // subsections only of the section being read (the last one whose top is above a fifth of the screen)
    var fillPanel = function () {
      var copy = tocList.cloneNode(true);
      copy.classList.remove('collapse'); copy.style.display = 'block';
      var current = null;
      copy.querySelectorAll('a.nav-link').forEach(function (a) {
        a.classList.remove('active');
        var target = document.getElementById(decodeURIComponent(a.hash.slice(1)));
        if (target && target.getBoundingClientRect().top <= window.innerHeight / 5) current = a;
      });
      if (current) current.classList.add('active');
      copy.querySelectorAll('ul').forEach(function (u) {
        var open = current && u.parentNode.contains(current);
        u.classList.remove('collapse'); u.style.display = open ? 'block' : 'none';
      });
      content.innerHTML = '';
      content.appendChild(copy);
      content.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closePanel); });
    };
    panel.appendChild(header);
    panel.appendChild(content);
    document.body.appendChild(overlay);
    document.body.appendChild(panel);

    var openPanel = function () {
      fillPanel();
      panel.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden';
    };
    var closePanel = function () {
      panel.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = '';
    };
    overlay.addEventListener('click', closePanel);
    closeBtn.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel.classList.contains('active')) closePanel();
    });

    var bar = document.querySelector('.quarto-secondary-nav .container-fluid');
    if (bar) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quarto-btn-toggle btn mobile-toc-nav-btn';
      btn.setAttribute('aria-label', 'On this page');
      btn.title = 'On this page';
      btn.innerHTML = '<i class="bi bi-list-nested"></i>';
      btn.addEventListener('click', openPanel);
      var menu = bar.querySelector('.quarto-btn-toggle');
      if (menu) menu.parentNode.insertBefore(btn, menu.nextSibling); else bar.appendChild(btn);
    }
  }

  /* ── Desktops: floating chevrons hide or show the book navigation and the table of contents ── */
  if (window.innerWidth >= 992) {
    [['left', 'quarto-sidebar', 'left-collapsed', 'Hide or show the book navigation', 'bi-chevron-left'],
     ['right', 'quarto-margin-sidebar', 'toc-collapsed', 'Hide or show the table of contents', 'bi-chevron-right']]
      .forEach(function (s) {
        if (!document.getElementById(s[1])) return;
        if (store(s[2]) === 'true') document.body.classList.add(s[2]);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sidebar-toggle sidebar-toggle-' + s[0];
        b.setAttribute('aria-label', s[3]);
        b.title = s[3];
        b.innerHTML = '<i class="bi ' + s[4] + '"></i>';
        b.addEventListener('click', function () {
          document.body.classList.toggle(s[2]);
          store(s[2], document.body.classList.contains(s[2]));
        });
        document.body.appendChild(b);
      });
  }
});
</script>
