      lightbox = null;
      document.documentElement.style.overflow = '';
      if (back) back.focus();
    }
    function key(e) {
      if (e.key === 'Escape') shut();
      else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); toggle(); }
    }
    lightbox.querySelector('.pod-lb-close').addEventListener('click', shut);
    lightbox.querySelector('.pod-lb-play').addEventListener('click', toggle);
    document.addEventListener('keydown', key);
    document.body.appendChild(lightbox);
    document.documentElement.style.overflow = 'hidden';
    setPlaying(!audio.paused);
    render();
    lightbox.querySelector('.pod-lb-close').focus();
  }
  if (mapImg) q('.pod-map').addEventListener('click', openMap);

  render(0);
})();
</script>
