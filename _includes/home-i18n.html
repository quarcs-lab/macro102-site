<!-- The home page in three languages: index.qmd (English), es/index.qmd and ja/index.qmd. Only the
     home page is translated; every other page stays English. Included by those three pages only.
     - On the English home page, a Spanish (es*) or Japanese (ja*) browser language is sent to es/ or
       ja/ before the page is drawn. A language picked in the switcher is remembered and wins.
       Opening es/ or ja/ directly never redirects, nor does a link to a section (#...) of the English page.
     - The switcher "English · Español · 日本語" sits under the title of all three pages.
     - On es/ and ja/, the sidebar (book title, parts, chapter titles) and the footer are translated. -->
<link rel="alternate" hreflang="en" href="https://quarcs-lab.github.io/macro102-site/">
<link rel="alternate" hreflang="es" href="https://quarcs-lab.github.io/macro102-site/es/">
<link rel="alternate" hreflang="ja" href="https://quarcs-lab.github.io/macro102-site/ja/">
<link rel="alternate" hreflang="x-default" href="https://quarcs-lab.github.io/macro102-site/">
<style>
.home-lang-switch { margin: 0.25rem 0 1.25rem; font-size: 0.95rem; }
.home-lang-switch a { text-decoration: none; }
.home-lang-switch a[aria-current="page"] { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.home-lang-switch .sep { opacity: 0.6; margin: 0 0.4rem; }
/* no previous/next links on the translated home pages (they would lead to Appendix I or each other) */
html[lang="es"] .page-navigation, html[lang="ja"] .page-navigation { display: none; }
</style>
<script>
(function () {
  var KEY = 'macro102-home-lang';
  var here = (document.documentElement.getAttribute('lang') || 'en').slice(0, 2);
  // From this page to each home page (the English one is the site root)
  var HOME = here === 'en' ? { en: './', es: 'es/', ja: 'ja/' } : { en: '../', es: '../es/', ja: '../ja/' };
  HOME[here] = './';

  function saved(value) {
    try {
      if (value === undefined) return localStorage.getItem(KEY);
      localStorage.setItem(KEY, value);
    } catch (e) { return null; }
  }
  function browserLang() {
    var l = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
    return l.indexOf('es') === 0 ? 'es' : l.indexOf('ja') === 0 ? 'ja' : 'en';
  }

  /* ── Redirect: English home page only, before anything is drawn ── */
  if (here === 'en' && !window.location.hash) {
    var want = saved();
    if (want !== 'en' && want !== 'es' && want !== 'ja') want = browserLang();
    if (want !== 'en') { window.location.replace(HOME[want]); return; }
  }

  /* ── Sidebar and footer text on the translated pages ── */
  var T = {
    es: {
      book: 'Ciencia de datos y modelos macroeconómicos',
      parts: { 'Preface': 'Prefacio', 'Preliminaries': 'Preliminares', 'The Long Run': 'El largo plazo',
               'The Short Run': 'El corto plazo', 'Applications': 'Aplicaciones', 'Appendices': 'Apéndices' },
      chapters: {
        'ch01': 'Introducción a la macroeconomía',
        'ch02': 'La medición de la macroeconomía',
        'ch03': 'Panorama del crecimiento económico de largo plazo',
        'ch04': 'Un modelo de producción',
        'ch05': 'El modelo de crecimiento de Solow',
        'ch06': 'El crecimiento y las ideas',
        'ch07': 'El mercado de trabajo, los salarios y el desempleo',
        'ch08': 'La inflación',
        'ch09': 'Introducción al corto plazo',
        'ch10': 'La Gran Recesión y la pandemia de Covid-19: una primera mirada',
        'ch11': 'La curva IS',
        'ch12': 'La política monetaria y la curva de Phillips',
        'ch13': 'La política de estabilización y el marco OA/DA',
        'ch14': 'Las crisis financieras y el modelo de corto plazo',
        'ch15': 'Modelos DSGE: la frontera de la investigación sobre los ciclos económicos',
        'ch16': 'El consumo',
        'ch17': 'La inversión',
        'ch18': 'El gobierno y la macroeconomía',
        'ch19': 'El comercio internacional',
        'ch20': 'Los tipos de cambio y las finanzas internacionales',
        'ch21': 'Reflexiones finales',
        'appA': 'Google Colab y Python impulsado por IA',
        'appB': 'Acceso a datos macroeconómicos con Python',
        'appC': 'Repaso de matemáticas para macroeconomía',
        'appD': 'Contabilidad del crecimiento y del desarrollo',
        'appE': 'Crecimiento y convergencia entre países',
        'appF': 'El modelo de crecimiento de Solow aumentado',
        'appG': 'Crecimiento e instituciones',
        'appH': 'Modelación DSGE con Python',
        'appI': 'El modelo DSGE de Smets y Wouters'
      },
      footer: '© 2026 Carlos Mendez. Con licencia <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.es">CC BY-NC 4.0</a>.'
    },
    ja: {
      book: 'データサイエンスとマクロ経済モデル',
      parts: { 'Preface': 'はじめに', 'Preliminaries': '準備', 'The Long Run': '長期',
               'The Short Run': '短期', 'Applications': '応用', 'Appendices': '付録' },
      chapters: {
        'ch01': 'マクロ経済学入門',
        'ch02': 'マクロ経済の測定',
        'ch03': '長期の経済成長の概観',
        'ch04': '生産のモデル',
        'ch05': 'ソロー成長モデル',
        'ch06': '成長とアイデア',
        'ch07': '労働市場、賃金、失業',
        'ch08': 'インフレ',
        'ch09': '短期入門',
        'ch10': '大不況とコロナ禍：最初の考察',
        'ch11': 'IS曲線',
        'ch12': '金融政策とフィリップス曲線',
        'ch13': '安定化政策とAS/ADの枠組み',
        'ch14': '金融危機と短期モデル',
        'ch15': 'DSGEモデル：景気循環研究の最前線',
        'ch16': '消費',
        'ch17': '投資',
        'ch18': '政府とマクロ経済',
        'ch19': '国際貿易',
        'ch20': '為替レートと国際金融',
        'ch21': 'おわりに',
        'appA': 'Google ColabとAIを活用したPython',
        'appB': 'Pythonによるマクロ経済データへのアクセス',
        'appC': 'マクロ経済学のための数学の復習',
        'appD': '成長会計と開発会計',
        'appE': '国々の成長と収束',
        'appF': '拡張ソロー成長モデル',
        'appG': '成長と制度',
        'appH': 'PythonによるDSGEモデル分析',
        'appI': 'Smets–WoutersのDSGEモデル'
      },
      footer: '© 2026 Carlos Mendez. <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.ja">CC BY-NC 4.0</a> ライセンスで公開。'
    }
  };

  function switcher() {
    var title = document.getElementById('title-block-header');
    if (!title) return;
    var nav = document.createElement('nav');
    nav.className = 'home-lang-switch notranslate';
    nav.setAttribute('translate', 'no');
    nav.setAttribute('aria-label', 'Language');
    [['en', 'English'], ['es', 'Español'], ['ja', '日本語']].forEach(function (pair, i) {
      if (i) { var s = document.createElement('span'); s.className = 'sep'; s.textContent = '·'; nav.appendChild(s); }
      var a = document.createElement('a');
      a.href = HOME[pair[0]];
      a.lang = pair[0];
      a.hreflang = pair[0];
      a.textContent = pair[1];
      if (pair[0] === here) a.setAttribute('aria-current', 'page');
      a.addEventListener('click', function () { saved(pair[0]); });
      nav.appendChild(a);
    });
    title.parentNode.insertBefore(nav, title.nextSibling);
  }

  function translateChrome(t) {
    document.title = t.book;   // not "... – Data Science and Macroeconomic Models"
    var title = document.querySelector('.sidebar-title a');
    if (title) { title.textContent = t.book; title.setAttribute('href', './'); }
    document.querySelectorAll('#quarto-sidebar .menu-text').forEach(function (e) {
      var k = e.textContent.trim();
      if (t.parts[k]) e.textContent = t.parts[k];
      // "Preface" stays on this page instead of going back to the English one
      if (k === 'Preface') { var a = e.closest('a'); if (a) a.setAttribute('href', './'); }
    });
    document.querySelectorAll('#quarto-sidebar a.sidebar-link').forEach(function (a) {
      var m = (a.getAttribute('href') || '').match(/notebooks\/(ch\d\d|app[A-Z])-/);
      var span = a.querySelector('.chapter-title');
      if (!m || !span || !t.chapters[m[1]]) return;
      var number = span.textContent.match(/^\s*([0-9A-Z]+\.\s+)/);
      span.textContent = (number ? number[1] : '') + t.chapters[m[1]];
    });
    var footer = document.querySelector('.nav-footer-center > p');
    if (footer) footer.innerHTML = t.footer;
    // the cover card above the table of contents (added by book-layout.html) links to this page too
    setTimeout(function () {
      var cover = document.getElementById('toc-cover-image');
      if (cover) { cover.setAttribute('href', './'); cover.title = t.parts['Preface']; }
    }, 0);
  }

  document.addEventListener('DOMContentLoaded', function () {
    switcher();
    if (T[here]) translateChrome(T[here]);
  });
})();
</script>
