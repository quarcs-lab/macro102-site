<!-- Standard audio player; generated by macro102/scripts/build_audio_players.py. -->
<script>
(() => {
  const id = location.pathname.split('/').pop().replace(/\.html$/, '');
  const episode = (window.MACRO102_PODCASTS || {})[id];
  const badge = document.querySelector('main img[alt="Open AI Notebook"]');
  const line = badge?.closest('p');
  if (!episode || !line || document.getElementById('podcast-' + id)) return;
  const base = new URL('../podcasts/player/', location.href);
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = new URL('podcast-player.css', base);
  document.head.append(css);
  const hostCSS = document.createElement('link');
  hostCSS.rel = 'stylesheet'; hostCSS.href = new URL('quarto-player.css', base);
  document.head.append(hostCSS);
  const runtime = document.createElement('script');
  runtime.src = new URL('podcast-player.js', base);
  const ready = new Promise((resolve, reject) => {
    runtime.onload = resolve; runtime.onerror = reject;
  });
  document.head.append(runtime);
  async function mount() {
    const response = await fetch(new URL('widgets.json', base));
    if (!response.ok) throw new Error('Player markup unavailable');
    const widgets = await response.json();
    if (!widgets[id]) throw new Error('Episode markup unavailable');
    const template = document.createElement('template');
    // Markup is generated locally with escaped text/attributes by the skill.
    template.innerHTML = widgets[id];
    const widget = template.content.firstElementChild;
    const syncTheme = () => {
      const light = document.body.classList.contains('quarto-light');
      widget.classList.toggle('light', light);
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (_) {}
    };
    syncTheme();
    new MutationObserver(syncTheme).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    line.after(widget);
    await window.StandardAudioPlayer.init(widget);
  }
  ready.then(mount).catch(() => {
    const fallback = document.createElement('a');
    fallback.href = new URL('transcripts/podcast-' + id + '.html', base);
    fallback.target = '_blank'; fallback.rel = 'noopener';
    fallback.textContent = 'Open Podcast Transcript';
    line.after(fallback);
  });
})();
</script>
